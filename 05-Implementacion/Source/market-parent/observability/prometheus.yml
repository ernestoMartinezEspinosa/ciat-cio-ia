global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "market-loader-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["market-loader-service:9080"]  # 👈 Corregido a 9080

  - job_name: "market-stream-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["market-stream-service:9081"]  # 👈 Agregado el nuevo servicio